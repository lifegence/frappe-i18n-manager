name: Linters

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linters-${{ github.event_name }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  publishable:
    name: Nothing addressed elsewhere
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Two things: a customer's name where it does not belong, and a document
      # written for a contract rather than for a reader. A text-only search once
      # called this repository clean while five .docx files still named the
      # customer, and two files that named nobody were published still carrying
      # a confidentiality stamp. The script itself lists what it looks for.
      - run: python3 scripts/check_publishable.py

  packaging:
    name: Packaging declarations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Declarations a deployment reads and a test never does. An app shipped
      # without [tool.bench.frappe-dependencies] installs on a local bench and
      # is refused by Frappe Cloud, so the customer finds out first.
      - run: python3 scripts/check_packaging.py

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  vulnerable-dependencies:
    name: Vulnerable dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pip-audit
      - run: pip-audit --desc on .

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The rules Frappe's own reviewers run over a marketplace submission.
      - run: |
          pip install semgrep
          git clone --depth 1 https://github.com/frappe/semgrep-rules.git /tmp/semgrep-rules
          semgrep --config /tmp/semgrep-rules/rules --error --metrics=off .
