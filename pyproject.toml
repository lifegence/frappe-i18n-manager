[project]
name = "lifegence_i18n"
authors = [
    { name = "Lifegence", email = "info@lifegence.co.jp"}
]
description = "Multilingual management for Frappe/ERPNext — locale profiles, translation ledger, glossary and coverage measurement"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
]

[project.optional-dependencies]
# Route 4 (rendered screens). Apache-2.0; not available on Frappe Cloud.
screen = ["playwright"]

[build-system]
requires = ["flit_core >=3.12,<4"]  # PEP 639: SPDX license string + license-files
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = [
    "B017",
    "B023",
    "B904",
    "E101",
    "E501",
    "F722",
    "W191",
    "RUF001",
    "RUF002",
    "RUF003",
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
